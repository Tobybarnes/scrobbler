name: Release Scrobbler

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" Scrobbler/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Scrobbler/Info.plist

      - name: Build app
        run: |
          xcodebuild build \
            -scheme Scrobbler \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Scrobbler.app \
            Scrobbler.zip
          shasum -a 256 Scrobbler.zip > Scrobbler.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Scrobbler.zip Scrobbler.zip.sha256 --generate-notes
